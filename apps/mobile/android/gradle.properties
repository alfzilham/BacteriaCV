org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation dimatikan.
#
# Gejalanya di mesin ini, diulang dan bukan sekali-keeper:
#   Could not close incremental caches in
#   build/<plugin>/kotlin/compileReleaseKotlin/cacheable/caches-jvm/jvm/kotlin:
#   class-fq-name-to-source.tab, source-to-classes.tab,
#   internal-name-to-source.tab
#
# Kegagalannya terjadi di task image_picker_android dan
# android_file_picker, dan tetap muncul setelah build/ dan
# android/.gradle dihapus serta semua daemon Gradle dimatikan. Jadi
# ini bukan cache yang rusak dan bukan proses yang tertinggal - Windows
# menahan file .tab itu saat compiler menutupnya.
#
# Matikan saja incremental: kompilasi satu build jadi lebih lambat
# beberapa detik, dan yang diminta spike ini adalah build yang bisa
# diselesaikan, bukan build yang paling cepat.
#
# Kalau someday build sudah tidak pernah gagal dan waktu incremental
# compilation jadi masalah, barulah baris ini yang dihapus.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
