name: bacteriacv_mobile
description: "BacteriaCV - on-device bacterial cell classification for Android."
publish_to: 'none'

# Package id aplikasi dikunci. Lihat AGENTS.md bagian Batas keras.
# applicationId di android/app/build.gradle.kts harus tetap
# alfzilham.ilham.bacteriacv_mobile - tidak bisa diubah setelah rilis
# pertama di Play Store.
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Memilih berkas, bukan foto dari galeri. Data DIBaS adalah TIFF dan
  # TIFF tidak muncul di galeri Android, jadi galeri tidak bisa dipakai.
  # image_picker sengaja tidak dipakai: spike P1 mengukurnya dan galeri
  # memang tidak memuat TIFF.
  file_picker: ^13.1.0

  # Decoder TIFF pure Dart. Platform codec Android tidak punya decoder
  # TIFF dan menolak dengan "Invalid image data", jadi paket image yang
  # dipakai. Jalur ini sudah diukur 134 ms warm.
  image: ^4.10.1

  # Menjalankan model ONNX on-device.
  # Catatan: nama paket yang disebut di instruksi spike,
  # onnxruntime_flutter, TIDAK ADA di pub.dev (HTTP 404 per 2026-10-05).
  # Yang dipakai gantinya adalah flutter_onnxruntime, fork yang aktif
  # dikelola dan mendukung konfigurasi execution provider.
  # Lihat docs/SPIKE-REPORT.md bagian P3.
  flutter_onnxruntime: ^1.8.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Model on-device dimuat sebagai asset saat runtime.
  # Berkas .onnx TIDAK di-commit (lihat .gitignore dan AGENTS.md), tapi
  # path-nya dideklarasikan di sini supaya `flutter build` menyalinnya ke
  # paket aplikasi. Spike menyalin model ke assets/ hanya sementara, dan
  # folder itu ikut di-ignore.
  assets:
    - assets/spike/