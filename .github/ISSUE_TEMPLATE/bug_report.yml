name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Website
        - API
        - Android app
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Say what you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A numbered list is best. Do not attach images of patients or any personal data.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser, operating system, Python or Node version, and the commit or release you used.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error text
      render: shell
