name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tes pada Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Pastikan backbone ResNet50 tersedia
        run: |
          python -c "import torch.hub; torch.hub.download_url_to_file('https://download.pytorch.org/models/resnet50-11ad3fa6.pth', '/tmp/resnet50.pth'); print('backbone siap')"

      - name: Jalankan tes
        run: python -m pytest tests -q
