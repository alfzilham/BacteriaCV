name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tes pada Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Pastikan backbone ResNet50 tersedia
        run: |
          python -c "import torch.hub; torch.hub.download_url_to_file('https://download.pytorch.org/models/resnet50-11ad3fa6.pth', '/tmp/resnet50.pth'); print('backbone siap')"

      - name: Jalankan tes
        run: python -m pytest tests -q

  site:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang dependensi
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tes
        run: npm test
      - name: Build
        run: npm run build

  mobile:
    name: Analyze dan tes Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  policy:
    name: Kebijakan repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tanpa em-dash dan tanpa karakter pengganti
        run: bash tools/check-policy.sh
